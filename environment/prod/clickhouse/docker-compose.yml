# ============================================================================
# ClickHouse — PROD (single node)
#
# KNOWN LIMITATION: no replication. Losing the disk loses the parsed data, though
# it can be rebuilt from Kafka within the retention window (7 days). For HA, add
# ClickHouse Keeper and switch the engine to ReplicatedReplacingMergeTree in
# src/transform/sql/20_targets.sql — the Flink job's inserts stay unchanged.
#
# MOUNT NOTES (learned the hard way in dev):
#   * Mount config.d files INDIVIDUALLY, never the whole directory — mounting over
#     it hides the image's docker_related_config.xml (which sets
#     listen_host 0.0.0.0), leaving ClickHouse listening only on 127.0.0.1 while
#     the healthcheck still reports green.
#   * users.d must NOT be :ro — the entrypoint writes default-user.xml into it.
# ============================================================================
name: vnmd-prod-clickhouse

services:
  clickhouse:
    image: ${CH_IMAGE}
    container_name: ch-prod
    restart: unless-stopped
    mem_limit: ${CH_MEM_LIMIT}
    cpus: ${CH_CPUS}
    networks: [vnmd-prod]
    stop_grace_period: 120s          # enough to flush buffers on shutdown
    # Do NOT publish 8123/9000 to the internet. Internal network only.
    expose: ["8123", "9000"]
    environment:
      CLICKHOUSE_DB: ${CH_DB}
      CLICKHOUSE_USER: ${CH_USER}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"    # prod: no self-service grants
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ${DATA_ROOT}/clickhouse/data:/var/lib/clickhouse
      - ${DATA_ROOT}/clickhouse/logs:/var/log/clickhouse-server
      - ${DATA_ROOT}/clickhouse/backup:/backup
      - ./config.d/10-resources.xml:/etc/clickhouse-server/config.d/10-resources.xml:ro
      - ./users.d:/etc/clickhouse-server/users.d
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "100m", max-file: "5"}

networks:
  vnmd-prod:
    external: true
