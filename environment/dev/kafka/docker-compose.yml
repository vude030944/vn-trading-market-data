# ============================================================================
# Redpanda: 3 brokers + Console — local dev environment
#
# Budget:  4.8G RAM  |  3.0 cores  |  30G disk  (Console excluded)
# Network: joins the external `vnmd-dev` network so Flink/ClickHouse can reach
#          it by the hostnames redpanda-0/1/2 (see environment/README.md)
#
# `--mode dev-container` is the single-machine profile: overprovisioned on,
# fsync OFF. Fast for dev but NOT durable — never carry it into prod.
# ============================================================================
name: vnmd-dev-kafka

x-redpanda-common: &redpanda-common
  image: ${RP_IMAGE}
  restart: unless-stopped
  mem_limit: ${RP_MEM_LIMIT}
  cpus: ${RP_CPUS}
  networks: [vnmd-dev]
  healthcheck:
    test: ["CMD-SHELL", "rpk cluster health -X admin.hosts=localhost:9644 | grep -E 'Healthy:.+true'"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 30s

services:
  # --------------------------------------------------------------- broker 0
  redpanda-0:
    <<: *redpanda-common
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda-0:33145
      - --advertise-rpc-addr=redpanda-0:33145
      - --seeds=redpanda-0:33145,redpanda-1:33145,redpanda-2:33145
      - --mode=dev-container
      - --smp=1
      - --memory=${RP_SEASTAR_MEM}
      - --reserve-memory=0M
      - --default-log-level=info
    volumes:
      - ${DATA_ROOT}/redpanda-0:/var/lib/redpanda/data
    ports:
      - "19092:19092"   # Kafka API (for clients running on the host)
      - "18081:18081"   # Schema Registry
      - "18082:18082"   # HTTP Proxy
      - "19644:9644"    # Admin API

  # --------------------------------------------------------------- broker 1
  redpanda-1:
    <<: *redpanda-common
    container_name: redpanda-1
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19093
      - --advertise-kafka-addr=internal://redpanda-1:9092,external://localhost:19093
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18083
      - --advertise-pandaproxy-addr=internal://redpanda-1:8082,external://localhost:18083
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18084
      - --rpc-addr=redpanda-1:33145
      - --advertise-rpc-addr=redpanda-1:33145
      - --seeds=redpanda-0:33145,redpanda-1:33145,redpanda-2:33145
      - --mode=dev-container
      - --smp=1
      - --memory=${RP_SEASTAR_MEM}
      - --reserve-memory=0M
      - --default-log-level=info
    volumes:
      - ${DATA_ROOT}/redpanda-1:/var/lib/redpanda/data
    ports:
      - "19093:19093"
      - "18084:18084"
      - "18083:18083"
      - "19645:9644"

  # --------------------------------------------------------------- broker 2
  redpanda-2:
    <<: *redpanda-common
    container_name: redpanda-2
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19094
      - --advertise-kafka-addr=internal://redpanda-2:9092,external://localhost:19094
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18085
      - --advertise-pandaproxy-addr=internal://redpanda-2:8082,external://localhost:18085
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18086
      - --rpc-addr=redpanda-2:33145
      - --advertise-rpc-addr=redpanda-2:33145
      - --seeds=redpanda-0:33145,redpanda-1:33145,redpanda-2:33145
      - --mode=dev-container
      - --smp=1
      - --memory=${RP_SEASTAR_MEM}
      - --reserve-memory=0M
      - --default-log-level=info
    volumes:
      - ${DATA_ROOT}/redpanda-2:/var/lib/redpanda/data
    ports:
      - "19094:19094"
      - "18086:18086"
      - "18085:18085"
      - "19646:9644"

  # --------------------------------------------------------------- console
  console:
    image: ${CONSOLE_IMAGE}
    container_name: redpanda-console
    restart: unless-stopped
    mem_limit: ${CONSOLE_MEM_LIMIT}
    cpus: ${CONSOLE_CPUS}
    networks: [vnmd-dev]
    ports:
      - "8080:8080"
    environment:
      # Console v3 maps YAML to ENV by upper-casing and joining levels with `_`
      # (kafka.brokers -> KAFKA_BROKERS, schemaRegistry.urls -> SCHEMAREGISTRY_URLS)
      KAFKA_BROKERS: redpanda-0:9092,redpanda-1:9092,redpanda-2:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda-0:8081,http://redpanda-1:8081,http://redpanda-2:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda-0:9644,http://redpanda-1:9644,http://redpanda-2:9644
    depends_on:
      redpanda-0: {condition: service_healthy}
      redpanda-1: {condition: service_healthy}
      redpanda-2: {condition: service_healthy}

networks:
  vnmd-dev:
    external: true
