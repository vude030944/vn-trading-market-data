# ============================================================================
# ClickHouse 26.7 — single node, dev environment
#
# Budget:  4.0G RAM  |  2.0 cores  |  25G disk
#
# NOTE ON THE IMAGE: server and client are the SAME multi-call binary here.
# Do not add a separate `clickhouse-client` service — just run:
#     docker exec -it clickhouse clickhouse-client
# ============================================================================
name: vnmd-dev-clickhouse

services:
  clickhouse:
    image: ${CH_IMAGE}
    container_name: clickhouse
    restart: unless-stopped
    mem_limit: ${CH_MEM_LIMIT}
    cpus: ${CH_CPUS}
    networks: [vnmd-dev]
    ports:
      - "8123:8123"   # HTTP (clients, Grafana, the Flink job's batch inserts)
      - "9000:9000"   # Native TCP (clickhouse-client)
    environment:
      CLICKHOUSE_DB: ${CH_DB}
      CLICKHOUSE_USER: ${CH_USER}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD}
      # Lets the user create users/roles/quotas — convenient in dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      # ClickHouse opens a great many files (each part is several files). Too low
      # a nofile limit is the classic "Too many open files" failure once tables grow.
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ${DATA_ROOT}/clickhouse/data:/var/lib/clickhouse
      - ${DATA_ROOT}/clickhouse/logs:/var/log/clickhouse-server
      # IMPORTANT: mount INDIVIDUAL FILES, never the whole config.d directory.
      # The image ships /etc/clickhouse-server/config.d/docker_related_config.xml
      # containing <listen_host>0.0.0.0</listen_host>. Mounting over the directory
      # hides that file => ClickHouse listens only on 127.0.0.1 and other
      # containers get "Connection refused", while the internal healthcheck still
      # reports green.
      - ./config.d/10-resources.xml:/etc/clickhouse-server/config.d/10-resources.xml:ro
      # users.d must NOT be :ro — the entrypoint writes default-user.xml here
      # when CLICKHOUSE_USER/PASSWORD are set (with :ro it restart-loops).
      - ./users.d:/etc/clickhouse-server/users.d
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host=localhost --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  vnmd-dev:
    external: true
