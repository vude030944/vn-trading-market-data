# nginx trên VM: nhận HTTPS cho rancher.vude030944.site rồi chuyển vào Rancher (cổng 80 của container).
# Theo tài liệu Rancher "Docker Install with TLS Termination at Layer-7 NGINX Load Balancer".
# Đặt tại /etc/nginx/sites-available/, symlink sang sites-enabled/, rồi: sudo nginx -t && sudo systemctl reload nginx
# Đường dẫn cert là mặc định của certbot; sửa nếu cert của bạn nằm chỗ khác.

map $http_upgrade $connection_upgrade {
    default Upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name rancher.vude030944.site;

    ssl_certificate     /etc/letsencrypt/live/rancher.vude030944.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rancher.vude030944.site/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket: kubectl shell trên UI và tunnel của agent
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Giữ phiên shell mở tới 15 phút
        proxy_read_timeout 900s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name rancher.vude030944.site;
    return 301 https://$server_name$request_uri;
}
