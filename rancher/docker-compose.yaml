# Rancher v2.15.2 chạy bằng Docker trên VM GCE, đứng sau nginx của VM.
# nginx giữ cert Let's Encrypt cho rancher.vude030944.site và chuyển request vào đây.
# Hướng dẫn chạy: rancher/README.md
services:
  rancher:
    image: rancher/rancher:v2.15.2
    container_name: rancher
    hostname: rancher
    restart: unless-stopped
    # Bên trong container chạy cả một cluster K3s (cluster "local"), nên cần privileged.
    privileged: true
    # TLS kết thúc ở nginx bằng cert công khai, nên Rancher không sinh CA riêng.
    # Nhờ vậy /cacerts không quảng bá một CA mà thực tế không ai dùng.
    command: ["--no-cacerts"]
    networks:
      - rancher-net
    # Chỉ mở trên 127.0.0.1: chỉ nginx trên cùng VM gọi được, mọi truy cập từ ngoài đi qua nginx.
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - rancher-data:/var/lib/rancher
    environment:
      CATTLE_SERVER_URL: "https://rancher.vude030944.site"
      # Agent trong các cluster con tin cả CA công khai trong kho của hệ điều hành (Let's Encrypt).
      # Bản cài mới mặc định "strict": agent chỉ tin CA trong setting cacerts, sẽ từ chối cert của nginx.
      CATTLE_AGENT_TLS_MODE: "system-store"
      # Tuỳ chọn, đặt trong file .env (không commit). Để trống thì Rancher tự sinh mật khẩu
      # một lần và in ra log: docker logs rancher 2>&1 | grep "Bootstrap Password:"
      CATTLE_BOOTSTRAP_PASSWORD: "${CATTLE_BOOTSTRAP_PASSWORD:-}"
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  rancher-net:
    name: rancher-net
    driver: bridge

volumes:
  rancher-data:
    name: rancher-data
