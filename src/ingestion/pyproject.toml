[project]
name = "vnmd-ingestion"
version = "0.1.0"
description = "Real-time Vietnamese market data ingestion from SSI / DNSE / TCBS into Kafka"
requires-python = ">=3.12"

dependencies = [
    "websockets>=13.0",        # WS client, using the newer asyncio API
    "aiokafka>=0.11.0",
    "cramjam>=2.8.0",          # aiokafka >=0.11 uses cramjam (NOT zstandard) for zstd
    "httpx>=0.27.0",           # fetch/refresh tokens over REST
    "uvloop>=0.19.0",
    "python-dotenv>=1.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.optional-dependencies]
# Only needed when DNSE_ENCODING=msgpack
msgpack = ["msgpack>=1.0.8"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
